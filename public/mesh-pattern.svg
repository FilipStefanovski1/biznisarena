<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <!-- Network mesh / plexus pattern -->
  <g stroke="rgba(255,255,255,0.5)" stroke-width="0.5">
    <!-- Main connecting lines -->
    <line x1="50" y1="120" x2="180" y2="80"/>
    <line x1="180" y1="80" x2="290" y2="150"/>
    <line x1="290" y1="150" x2="350" y2="60"/>
    <line x1="350" y1="60" x2="480" y2="110"/>
    <line x1="480" y1="110" x2="550" y2="40"/>
    <line x1="550" y1="40" x2="680" y2="90"/>
    <line x1="680" y1="90" x2="750" y2="50"/>

    <line x1="80" y1="200" x2="200" y2="160"/>
    <line x1="200" y1="160" x2="180" y2="80"/>
    <line x1="200" y1="160" x2="290" y2="150"/>
    <line x1="290" y1="150" x2="380" y2="220"/>
    <line x1="380" y1="220" x2="480" y2="110"/>
    <line x1="380" y1="220" x2="450" y2="280"/>
    <line x1="480" y1="110" x2="560" y2="200"/>
    <line x1="560" y1="200" x2="680" y2="90"/>
    <line x1="560" y1="200" x2="650" y2="250"/>
    <line x1="650" y1="250" x2="750" y2="180"/>

    <line x1="50" y1="120" x2="80" y2="200"/>
    <line x1="80" y1="200" x2="150" y2="300"/>
    <line x1="150" y1="300" x2="260" y2="280"/>
    <line x1="260" y1="280" x2="290" y2="150"/>
    <line x1="260" y1="280" x2="380" y2="220"/>
    <line x1="260" y1="280" x2="300" y2="370"/>
    <line x1="300" y1="370" x2="450" y2="280"/>
    <line x1="450" y1="280" x2="560" y2="200"/>
    <line x1="450" y1="280" x2="520" y2="350"/>
    <line x1="520" y1="350" x2="650" y2="250"/>
    <line x1="650" y1="250" x2="720" y2="320"/>

    <line x1="150" y1="300" x2="200" y2="400"/>
    <line x1="200" y1="400" x2="300" y2="370"/>
    <line x1="300" y1="370" x2="400" y2="420"/>
    <line x1="400" y1="420" x2="520" y2="350"/>
    <line x1="520" y1="350" x2="600" y2="420"/>
    <line x1="600" y1="420" x2="720" y2="320"/>
    <line x1="720" y1="320" x2="780" y2="380"/>

    <line x1="100" y1="450" x2="200" y2="400"/>
    <line x1="200" y1="400" x2="320" y2="480"/>
    <line x1="320" y1="480" x2="400" y2="420"/>
    <line x1="400" y1="420" x2="500" y2="500"/>
    <line x1="500" y1="500" x2="600" y2="420"/>
    <line x1="600" y1="420" x2="700" y2="480"/>
    <line x1="700" y1="480" x2="780" y2="380"/>

    <line x1="50" y1="520" x2="100" y2="450"/>
    <line x1="100" y1="450" x2="220" y2="530"/>
    <line x1="220" y1="530" x2="320" y2="480"/>
    <line x1="320" y1="480" x2="420" y2="550"/>
    <line x1="420" y1="550" x2="500" y2="500"/>
    <line x1="500" y1="500" x2="620" y2="560"/>
    <line x1="620" y1="560" x2="700" y2="480"/>
    <line x1="700" y1="480" x2="770" y2="540"/>

    <!-- Cross connections -->
    <line x1="350" y1="60" x2="200" y2="160"/>
    <line x1="550" y1="40" x2="560" y2="200"/>
    <line x1="80" y1="200" x2="260" y2="280"/>
    <line x1="380" y1="220" x2="520" y2="350"/>
    <line x1="150" y1="300" x2="300" y2="370"/>
    <line x1="450" y1="280" x2="600" y2="420"/>
    <line x1="100" y1="450" x2="300" y2="370"/>
    <line x1="400" y1="420" x2="620" y2="560"/>
    <line x1="200" y1="400" x2="100" y2="450"/>
    <line x1="520" y1="350" x2="700" y2="480"/>
  </g>

  <!-- Dots at intersections -->
  <g fill="rgba(255,255,255,0.7)">
    <circle cx="50" cy="120" r="2"/>
    <circle cx="180" cy="80" r="2.5"/>
    <circle cx="290" cy="150" r="2"/>
    <circle cx="350" cy="60" r="2.5"/>
    <circle cx="480" cy="110" r="2"/>
    <circle cx="550" cy="40" r="2.5"/>
    <circle cx="680" cy="90" r="2"/>
    <circle cx="750" cy="50" r="2.5"/>
    <circle cx="80" cy="200" r="2"/>
    <circle cx="200" cy="160" r="2.5"/>
    <circle cx="380" cy="220" r="2"/>
    <circle cx="560" cy="200" r="2.5"/>
    <circle cx="650" cy="250" r="2"/>
    <circle cx="750" cy="180" r="2.5"/>
    <circle cx="150" cy="300" r="2"/>
    <circle cx="260" cy="280" r="2.5"/>
    <circle cx="300" cy="370" r="2"/>
    <circle cx="450" cy="280" r="2.5"/>
    <circle cx="520" cy="350" r="2"/>
    <circle cx="720" cy="320" r="2.5"/>
    <circle cx="200" cy="400" r="2"/>
    <circle cx="400" cy="420" r="2.5"/>
    <circle cx="600" cy="420" r="2"/>
    <circle cx="780" cy="380" r="2.5"/>
    <circle cx="100" cy="450" r="2"/>
    <circle cx="320" cy="480" r="2.5"/>
    <circle cx="500" cy="500" r="2"/>
    <circle cx="700" cy="480" r="2.5"/>
    <circle cx="50" cy="520" r="2"/>
    <circle cx="220" cy="530" r="2.5"/>
    <circle cx="420" cy="550" r="2"/>
    <circle cx="620" cy="560" r="2.5"/>
    <circle cx="770" cy="540" r="2"/>
  </g>
</svg>